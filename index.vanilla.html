    .cta-pastel {

    }

    /* Floating navbar pill */
    .floating-nav {
      background: #ffffff;
      border-radius: 1.15rem;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.9);

      border: 1px solid #f1f5f9;
      box-shadow: 0 10px 28px rgba(15, 23, 42, 0.05);

    .mess-card {
      transition: transform 0.22s ease, box-shadow 0.22s ease, border-color 0.22s ease;

    .mess-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 18px 38px rgba(15, 23, 42, 0.09);
      border-color: #dbeafe;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      border-radius: 999px;
      white-space: nowrap;
    }
    .line-clamp-2 {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .modal-backdrop {
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(6px);
    }
    .toast {
      animation: slideIn 0.25s ease both;
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .rating-star {
      transition: transform 0.15s ease, color 0.15s ease;

    .compare-scroll { -webkit-overflow-scrolling: touch; scrollbar-width: thin; }

    function filteredMesses() {
      const query = state.query.toLowerCase().trim();
      let result = messesData.filter(m => {
        const haystack = [m.name,m.owner,m.foodType,m.cuisineCategory,m.category,...m.specialtyTags,...m.studentHighlights].join(" ").toLowerCase();
        return (!query || haystack.includes(query)) && (state.food === "All food" || m.foodType === state.food) && (state.cuisine === "All cuisines" || m.cuisineCategory === state.cuisine);
      });
      if (state.sort === "Closest first") result.sort((a,b) => a.distanceMeters - b.distanceMeters);
      if (state.sort === "Lowest plate") result.sort((a,b) => a.pricing.dailyPlate - b.pricing.dailyPlate);
      if (state.sort === "Highest rated") result.sort((a,b) => averageRating(b) - averageRating(a));
      return result;
    }

              <input name="name" required maxlength="80" placeholder="e.g. Aditi Sharma" class="w-full rounded-xl border border-slate-200 px-4 py-3 text-sm outline-none transition focus:border-brand-blue focus:ring-4 focus:ring-brand-blue/10" />
            </label>
            <label class="block">
              <span class="mb-1.5 block text-xs font-bold uppercase tracking-wider text-slate-500">Student email ID</span>
              <input name="email" required type="email" maxlength="120" placeholder="you@pict.edu or personal email" class="w-full rounded-xl border border-slate-200 px-4 py-3 text-sm outline-none transition focus:border-brand-blue focus:ring-4 focus:ring-brand-blue/10" />
            </label>
            <div id="otp-step" class="hidden rounded-2xl border border-orange-200 bg-brand-orangeLight p-4">
              <div class="flex items-start gap-3">
                <div class="text-brand-orange">${icon("mail-check",19)}</div>
                <div class="min-w-0 flex-1">
                  <p class="text-sm font-extrabold text-slate-900">Enter your one-time password</p>
                  <p id="otp-hint" class="mt-1 text-xs leading-5 text-slate-700">A 6-digit OTP has been generated for this browser preview.</p>
                  <input name="otp" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="6-digit OTP" class="mt-3 w-full rounded-xl border border-orange-200 bg-white px-4 py-3 text-sm font-bold tracking-[.35em] outline-none focus:border-brand-orange" />
                </div>
              </div>
            </div>
            <div>
              <span class="mb-1.5 block text-xs font-bold uppercase tracking-wider text-slate-500">Your rating</span>
              <div class="grid grid-cols-5 gap-1 rounded-xl bg-slate-50 p-2">
                ${[1,2,3,4,5].map(n => `<button type="button" data-rating="${n}" class="rating-star rounded-lg py-2 text-center text-xl ${n <= state.reviewRating ? "active" : "text-slate-300"}" aria-label="${n} star${n>1?"s":""}">${n <= state.reviewRating ? "★" : "☆"}</button>`).join("")}
              </div>
              <p id="rating-label" class="mt-2 text-xs font-bold text-brand-orange">${ratingLabels[state.reviewRating]}</p>
              <input type="hidden" name="rating" value="${state.reviewRating}" />
            </div>
            <label class="block">
              <span class="mb-1.5 block text-xs font-bold uppercase tracking-wider text-slate-500">Written review</span>
              <textarea name="text" required minlength="10" maxlength="600" rows="4" placeholder="Tell the next student about taste, hygiene, acidity, chapati softness…" class="w-full resize-none rounded-xl border border-slate-200 px-4 py-3 text-sm leading-6 outline-none transition focus:border-brand-blue focus:ring-4 focus:ring-brand-blue/10"></textarea>
            </label>
            <button id="send-otp-button" type="button" data-action="send-otp" class="flex w-full items-center justify-center gap-2 rounded-xl bg-brand-blue px-4 py-3.5 text-sm font-bold text-white shadow-sm transition hover:bg-brand-blueHover">${icon("send",16)} Send OTP to verify email</button>
            <button id="publish-review-button" type="submit" class="hidden w-full items-center justify-center gap-2 rounded-xl bg-brand-orange px-4 py-3.5 text-sm font-bold text-white shadow-sm transition hover:bg-brand-orangeHover">${icon("badge-check",16)} Verify OTP & publish review</button>
          </form>
        </div>
      </div>`;
    }

    function renderDetail(id) {
      const mess = messesData.find(m => m.id === Number(id));
      if (!mess) return renderHome();
      state.selectedId = mess.id;
      app.innerHTML = detailView(mess);
      refreshIcons();
      window.scrollTo({ top:0, behavior:"instant" });
    }

    function openReview() {
      const mess = messesData.find(m => m.id === state.selectedId);
      if (!mess) return;
      document.body.insertAdjacentHTML("beforeend", reviewModal(mess));
      refreshIcons();
      document.querySelector("#review-modal input[name=name]")?.focus();
    }

    function openCompare() {
      const markup = compareModal();
      if (!markup) return;
      document.body.insertAdjacentHTML("beforeend", markup);
      refreshIcons();
    }

    function sendReviewOtp() {
      const form = document.querySelector("#review-form");
      if (!form || !form.reportValidity()) return;
      const email = normalizeEmail(new FormData(form).get("email"));
      if (hasReviewByEmail(state.selectedId, email)) {
        toast("This email has already rated this mess.", "dark");
        return;
      }
      const code = String(Math.floor(100000 + Math.random() * 900000));
      state.pendingOtp = { messId: state.selectedId, emailKey: email, code };
      document.querySelector("#otp-step")?.classList.remove("hidden");
      document.querySelector("#send-otp-button")?.classList.add("hidden");
      document.querySelector("#publish-review-button")?.classList.remove("hidden");
      const emailInput = form.querySelector('input[name="email"]');
      if (emailInput) emailInput.disabled = true;
      const hint = document.querySelector("#otp-hint");
      if (hint) hint.innerHTML = `Browser preview OTP: <strong class="tracking-[.2em] text-brand-orange">${code}</strong>`;
      document.querySelector('input[name="otp"]')?.focus();
    }

    function route() {
      const match = window.location.hash.match(/^#mess-(\d+)$/);
      match ? renderDetail(match[1]) : renderHome();
    }

    document.addEventListener("click", event => {
      const target = event.target.closest("[data-action], [data-rating]");
      if (!target) return;
      if (target.dataset.rating) {
        state.reviewRating = Number(target.dataset.rating);
        document.querySelectorAll(".rating-star").forEach(button => {
          const n = Number(button.dataset.rating);
          button.classList.toggle("active", n <= state.reviewRating);
          button.classList.toggle("text-slate-300", n > state.reviewRating);
          button.textContent = n <= state.reviewRating ? "★" : "☆";
        });
        const label = ["","★☆☆☆☆ (1 Star) - Not Recommended","★★☆☆☆ (2 Stars) - Needs Improvement","★★★☆☆ (3 Stars) - Average","★★★★☆ (4 Stars) - Must Try","★★★★★ (5 Stars) - Excellent"][state.reviewRating];
        document.querySelector("#rating-label").textContent = label;
        document.querySelector('input[name="rating"]').value = state.reviewRating;
        return;
      }
      const action = target.dataset.action;
      if (!action) return;
      if (action === "detail") window.location.hash = `mess-${target.dataset.id}`;
      if (action === "home") { window.location.hash = ""; route(); window.scrollTo({top:0,behavior:"smooth"}); }
      if (action === "review") openReview();
      if (action === "send-otp") sendReviewOtp();
      if (action === "close-review") { state.pendingOtp = null; document.querySelector("#review-modal")?.remove(); }
      if (action === "toggle-compare") {
        const id = Number(target.dataset.id);
        if (state.compareIds.includes(id)) {
          state.compareIds = state.compareIds.filter(compareId => compareId !== id);
        } else if (state.compareIds.length >= 3) {
          toast("Compare up to three messes at a time.", "dark");
          return;
        } else {
          state.compareIds.push(id);
          toast("Added to comparison.", "green");
        }
        renderCurrentView();
      }
      if (action === "compare-panel") openCompare();
      if (action === "close-compare") document.querySelector("#compare-modal")?.remove();
      if (action === "clear-compare") { state.compareIds = []; renderCurrentView(); }
      if (action === "remove-compare") {
        state.compareIds = state.compareIds.filter(compareId => compareId !== Number(target.dataset.id));
        document.querySelector("#compare-modal")?.remove();
        renderCurrentView();
        if (state.compareIds.length >= 2) openCompare();
      }
      if (action === "reset") {
        state.query = "";
        state.food = "All food";
        state.cuisine = "All cuisines";
        state.sort = "Recommended";
        renderHome();
      }
      if (action === "quick-cuisine") {
        state.cuisine = target.dataset.cuisine;
        window.location.hash = "";
        renderHome();
        document.querySelector("#explore-messes")?.scrollIntoView({ behavior: "smooth" });
      }
      if (action === "quick-food") {
        state.food = target.dataset.food;
        window.location.hash = "";
        renderHome();
        document.querySelector("#explore-messes")?.scrollIntoView({ behavior: "smooth" });
      }
      if (action === "quick-sort") {
        state.sort = target.dataset.sort;
        window.location.hash = "";
        renderHome();
        document.querySelector("#explore-messes")?.scrollIntoView({ behavior: "smooth" });
      }
      if (action === "about") toast("Every listing is based on an in-person PICT student survey — compare prices, hygiene, and timings easily.", "green");
      if (action === "search-submit") {
        clearTimeout(searchScrollTimer);
        scrollToResults();
      }
    });

    let searchScrollTimer = null;
    function scrollToResults() {
      const target = document.querySelector("#explore-messes");
      if (target) {
        target.scrollIntoView({ behavior: "smooth", block: "start" });
      }
    }

    document.addEventListener("input", event => {
      if (event.target.id === "search") {
        state.query = event.target.value;
        renderHome();
        const search = document.querySelector("#search");
        search?.focus({ preventScroll: true });
        search?.setSelectionRange(state.query.length, state.query.length);

        clearTimeout(searchScrollTimer);
        // After student stops typing any mess name or keyword, smoothly scroll to results
        if (state.query.trim().length > 0) {
          searchScrollTimer = setTimeout(() => {
            scrollToResults();
          }, 450);
        }
      }
    });

    document.addEventListener("keydown", event => {
      if (event.target.id === "search" && event.key === "Enter") {
        event.preventDefault();
        clearTimeout(searchScrollTimer);
        scrollToResults();
      }
    });

    document.addEventListener("change", event => {
      if (event.target.id === "food-filter") state.food = event.target.value;
      if (event.target.id === "cuisine-filter") state.cuisine = event.target.value;
      if (event.target.id === "sort-filter") state.sort = event.target.value;
      if (["food-filter","cuisine-filter","sort-filter"].includes(event.target.id)) {
        renderHome();
        if (event.target.id !== "sort-filter") {
          scrollToResults();
        }
      }
    });

    document.addEventListener("submit", event => {
      if (event.target.id !== "review-form") return;
      event.preventDefault();
      const form = new FormData(event.target), email = normalizeEmail(form.get("email")), otp = String(form.get("otp") || "").trim();
      if (!state.pendingOtp || state.pendingOtp.messId !== state.selectedId || state.pendingOtp.emailKey !== email) {
        toast("Send an OTP to verify this email first.", "dark");
        return;
      }
      if (otp !== state.pendingOtp.code) {
        toast("That OTP is incorrect. Check the code and try again.", "dark");
        return;
      }
      if (hasReviewByEmail(state.selectedId, email)) {
        toast("This email has already rated this mess.", "dark");
        return;
      }
      const verified = verifyReviewer(email), rating = Number(form.get("rating"));
      const review = {
        name: String(form.get("name")).trim(),
        email,
        emailKey: email,
        emailVerified: true,
        rating,
        label: ["","Not Recommended","Needs Improvement","Average","Must Try","Excellent"][rating],
        text: String(form.get("text")).trim(),
        verified,
        date: new Intl.DateTimeFormat("en-IN",{day:"2-digit",month:"short",year:"numeric"}).format(new Date())
      };
      const reviews = getReviews(state.selectedId);
      reviews.push(review);
      localStorage.setItem(reviewsKey(state.selectedId), JSON.stringify(reviews));
      const verifiedMessId = state.selectedId;
      state.pendingOtp = null;
      document.querySelector("#review-modal")?.remove();
      renderDetail(verifiedMessId);
      toast(verified ? "Email verified. Review published with PICT badge." : "Email verified. Review published as a community reviewer.", "green");
    });

    window.addEventListener("hashchange", route);
    route();
  </script>
</body>
</html>
